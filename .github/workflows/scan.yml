name: Chartscan
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chartscan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan for patterns
        run: node scan.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      - name: Save state
        if: always()
        run: |
          git config user.name "chartscan-bot"
          git config user.email "chartscan-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update state" && git push)
